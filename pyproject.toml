[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-council"
version = "0.1.0"
description = "Multi-agent investment analysis framework built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "feedparser",
    "google-adk[extensions]",
    "google-cloud-storage",
    "litellm",
    "lxml",
    "numpy",
    "pandas",
    "python-dotenv",
    "requests",
    "ta",
    "yfinance",
]

[project.scripts]
alpha-council = "alpha_council.cli.run:main"
alpha-council-ollama-lite = "alpha_council.cli.run_ollama_lite:main"

[tool.setuptools.packages.find]
include = ["alpha_council*"]

[tool.agents-cli]
acli_version = "0.1.2"
agent_directory = "alpha_council"
region = "asia-east1"

[tool.agents-cli.create_params]
deployment_target = "cloud_run"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
